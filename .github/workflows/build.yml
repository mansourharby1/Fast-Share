name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          SETTINGS=$(find . -name settings.gradle | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found. Repo structure:"
            find . -maxdepth 3 -not -path './.git/*'
            exit 1
          fi
          cd "$(dirname "$SETTINGS")"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastShare-apk
          path: "**/build/outputs/apk/debug/*.apk"
